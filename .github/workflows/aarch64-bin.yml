name: prebuilt binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build (e.g. v1.10.4). Leave blank to use latest upstream release.'
        required: false
        type: string
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve target tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(gh api repos/kanidm/kanidm/releases/latest --jq .tag_name)
          fi
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "Target tag: $TAG"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
            triple: aarch64-linux-gnu
          - arch: x86_64
            runner: ubuntu-24.04
            triple: x86_64-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Skip if release asset already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${TAG}-bin"
          ASSET="kanidm-${TAG}-${{ matrix.triple }}.tar.gz"
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$ASSET"; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "Asset $ASSET already in release $RELEASE_TAG, skipping."
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi
          echo "release_tag=$RELEASE_TAG" >>"$GITHUB_OUTPUT"
          echo "asset=$ASSET" >>"$GITHUB_OUTPUT"

      - name: Checkout upstream at tag
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v5
        with:
          repository: kanidm/kanidm
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Install build dependencies
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang pkg-config \
            libssl-dev libsqlite3-dev libudev-dev libpam0g-dev \
            libdbus-1-dev libcap-dev libtss2-dev

      - name: Install Rust toolchain
        if: steps.check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        if: steps.check.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ needs.resolve.outputs.tag }}-${{ matrix.arch }}

      - name: Build
        if: steps.check.outputs.skip != 'true'
        run: |
          cargo build --release --locked \
            -p kanidm_tools \
            -p kanidm_unix_int \
            -p daemon

      - name: Stage artifacts
        if: steps.check.outputs.skip != 'true'
        id: stage
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          STAGE="kanidm-${TAG}-${TRIPLE}"
          mkdir -p "$STAGE/bin"
          for b in kanidm kanidm_ssh_authorizedkeys_direct \
                   kanidm_unixd kanidm_unixd_tasks \
                   kanidm_ssh_authorizedkeys kanidm-unix \
                   kanidmd; do
            if [ -x "target/release/$b" ]; then
              cp "target/release/$b" "$STAGE/bin/"
              strip "$STAGE/bin/$b" || true
            else
              echo "WARNING: target/release/$b not found"
            fi
          done
          mkdir -p "$STAGE/systemd" "$STAGE/config"
          cp examples/systemd/kanidm-unixd.service       "$STAGE/systemd/"
          cp examples/systemd/kanidm-unixd-tasks.service "$STAGE/systemd/"
          cp platform/opensuse/kanidmd.service           "$STAGE/systemd/"
          sed -i -e 's|/usr/local/sbin/|/usr/bin/|g' \
                 -e 's|/usr/sbin/|/usr/bin/|g' \
                 "$STAGE"/systemd/*.service
          cp examples/server.toml "$STAGE/config/server.toml.example"
          cp examples/unixd       "$STAGE/config/unixd.example"
          cp examples/kanidm      "$STAGE/config/config.example"
          ldd "$STAGE/bin/kanidm" > "$STAGE/ldd-kanidm.txt" || true
          cat >"$STAGE/README" <<EOF
          kanidm ${TAG} - prebuilt ${TRIPLE} binaries.

          Built from https://github.com/kanidm/kanidm @ ${TAG}
          Built by  ${{ github.repository }} via GitHub Actions on Ubuntu 24.04.

          Dynamic libraries required (see ldd-kanidm.txt). On Arch:
            pacman -S openssl sqlite systemd-libs pam dbus libcap tpm2-tss
          EOF
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          echo "tarball=${STAGE}.tar.gz" >>"$GITHUB_OUTPUT"
          echo "sha256=${STAGE}.tar.gz.sha256" >>"$GITHUB_OUTPUT"

      - name: Publish release asset
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_TAG: ${{ steps.check.outputs.release_tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --title "kanidm $TAG (prebuilt)" \
              --notes "Prebuilt Linux binaries for kanidm $TAG, built from upstream tag $TAG. Source of truth: https://github.com/kanidm/kanidm/releases/tag/$TAG"
          fi
          gh release upload "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --clobber \
            "${{ steps.stage.outputs.tarball }}" \
            "${{ steps.stage.outputs.sha256 }}"

  publish-aur:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install tooling
        run: |
          pacman -Sy --noconfirm --needed base-devel git openssh pacman-contrib namcap curl
          useradd -m builder
          install -d -m 0700 -o builder -g builder /home/builder/.ssh

      - name: Checkout fork (template + workflow)
        uses: actions/checkout@v5

      - name: Resolve version & fetch checksums
        id: vars
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${TAG}-bin"
          PKGVER="${TAG#v}"
          base="https://github.com/${REPO}/releases/download/${RELEASE_TAG}"
          SHA_X86=$(curl -fsSL "${base}/kanidm-${TAG}-x86_64-linux-gnu.tar.gz.sha256" | awk '{print $1}')
          SHA_ARM=$(curl -fsSL "${base}/kanidm-${TAG}-aarch64-linux-gnu.tar.gz.sha256" | awk '{print $1}')
          echo "pkgver=$PKGVER" >>"$GITHUB_OUTPUT"
          echo "sha_x86=$SHA_X86" >>"$GITHUB_OUTPUT"
          echo "sha_arm=$SHA_ARM" >>"$GITHUB_OUTPUT"

      - name: Render PKGBUILD
        env:
          PKGVER: ${{ steps.vars.outputs.pkgver }}
          SHA_X86: ${{ steps.vars.outputs.sha_x86 }}
          SHA_ARM: ${{ steps.vars.outputs.sha_arm }}
        run: |
          set -euo pipefail
          mkdir -p aur-stage
          sed -e "s|%%PKGVER%%|${PKGVER}|g" \
              -e "s|%%SHA256_X86_64%%|${SHA_X86}|g" \
              -e "s|%%SHA256_AARCH64%%|${SHA_ARM}|g" \
              .aur/kanidm-bin/PKGBUILD.in > aur-stage/PKGBUILD
          chown -R builder:builder aur-stage

      - name: Generate .SRCINFO & lint
        run: |
          cd aur-stage
          sudo -u builder bash -c 'makepkg --printsrcinfo > .SRCINFO'
          sudo -u builder namcap PKGBUILD || true

      - name: Configure SSH for AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 0600 /dev/stdin /home/builder/.ssh/id_ed25519 <<<"$AUR_SSH_KEY"
          chown builder:builder /home/builder/.ssh/id_ed25519
          sudo -u builder ssh-keyscan aur.archlinux.org > /home/builder/.ssh/known_hosts
          chown builder:builder /home/builder/.ssh/known_hosts
          cat >/home/builder/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
          EOF
          chown builder:builder /home/builder/.ssh/config

      - name: Push to AUR
        env:
          PKGVER: ${{ steps.vars.outputs.pkgver }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          sudo -u builder PKGVER="$PKGVER" WS="$GITHUB_WORKSPACE" bash -euxo pipefail <<'EOS'
          cd /tmp
          git config --global user.email "github-actions@bendik.local"
          git config --global user.name "kanidm-bin auto-publish"
          git config --global init.defaultBranch master
          git clone ssh://aur@aur.archlinux.org/kanidm-bin.git || {
            mkdir kanidm-bin && cd kanidm-bin && git init
            git remote add origin ssh://aur@aur.archlinux.org/kanidm-bin.git
            cd ..
          }
          cd /tmp/kanidm-bin
          cp "${WS}/aur-stage/PKGBUILD" .
          cp "${WS}/aur-stage/.SRCINFO" .
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR already up to date, nothing to push."
            exit 0
          fi
          git commit -m "kanidm-bin ${PKGVER}"
          git push -u origin HEAD:master
          EOS
